name: Publish image

on:
  # Publish when you push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
  push:
    tags:
      - "v*"
  # Manual publishing for an arbitrary tag, optionally overriding the kagi-cli version.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. v1.0.0)."
        required: true
        type: string
      kagi_version:
        description: "kagi-cli version to build. Empty = the Dockerfile's KAGI_VERSION."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kagi-cli" >> "$GITHUB_OUTPUT"

      - name: kagi-cli build arg
        id: kagi
        env:
          KAGI_VERSION: ${{ inputs.kagi_version }}
        run: |
          set -euo pipefail
          if [ -n "${KAGI_VERSION:-}" ]; then
            echo "arg=KAGI_VERSION=${KAGI_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: ${{ steps.kagi.outputs.arg }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
